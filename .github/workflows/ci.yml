name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Test with local fixtures
        run: python -m pytest
      - name: Build source and wheel distributions
        run: python -m build
      - name: Smoke test the wheel in a clean environment
        shell: python
        run: |
          import os
          import pathlib
          import subprocess
          import tempfile
          import venv

          wheel = next(pathlib.Path("dist").glob("*.whl")).resolve()
          with tempfile.TemporaryDirectory() as directory:
              venv.create(directory, with_pip=True)
              scripts = "Scripts" if os.name == "nt" else "bin"
              executable = "python.exe" if os.name == "nt" else "python"
              python = pathlib.Path(directory, scripts, executable)
              subprocess.run([str(python), "-m", "pip", "install", str(wheel)], check=True)
              subprocess.run([str(python), "-m", "webcollect", "--help"], check=True)
